name: Phase 1 checks
on: [push, pull_request]
jobs:
  mock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python -m pip install -r requirements-web.txt -r requirements-web-dev.txt
      - run: python -m ruff check recordings.py tests/test_recordings.py server.py live_timing.py start_web.py demo_strategy.py wheel_input.py tests/test_web_phase1.py tests/test_my_race.py tests/test_live_udp.py
      - run: python -m mypy --follow-imports=silent recordings.py server.py live_timing.py start_web.py demo_strategy.py wheel_input.py
      - run: python -m pytest -q tests/test_recordings.py tests/test_web_phase1.py tests/test_my_race.py tests/test_live_udp.py
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
