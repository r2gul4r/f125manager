<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 25 · Race Engineer</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #08080a; overflow: clip }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    html[data-layout="fit"] iframe { inset: 50% auto auto 50%; width: 1920px; height: 1080px;
      transform: translate(-50%, -50%) scale(var(--fit)); }
  </style>
</head>
<body>
  <iframe title="Race dashboard" data-desktop-shell></iframe>
  <script>
    try { document.documentElement.dataset.layout = localStorage.getItem('pitwall.display.layout') || 'fill'; } catch {}
    document.querySelector('iframe').src = new URLSearchParams(location.search).get('source') === 'demo' ? './?source=demo' : './';
    function fitDashboard() {
      document.documentElement.style.setProperty('--fit', Math.min(innerWidth / 1920, innerHeight / 1080));
    }
    fitDashboard();
    window.addEventListener('resize', fitDashboard);
    document.querySelector('iframe').addEventListener('load', event => event.target.contentWindow.focus());
  </script>
</body>
</html>
